<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>진행자 기록 | 사주모아 UT</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./admin.css">
  <script type="module" src="./admin.js"></script>
</head>
<body>
  <header class="page-header"><div class="header-inner"><a class="brand" href="./index.html">Sajumoa <span>UT</span></a><span class="tag">진행자용</span></div></header>
  <main>
    <div class="intro"><p class="eyebrow">사용자 테스트 기록</p><h1>참가자의 선택을 확인하세요</h1><p>이 브라우저에 저장된 행동과 답변입니다. 다른 기기의 기록은 참가자가 내려받은 JSON 파일을 가져와 확인할 수 있습니다.</p></div>
    <div class="toolbar" aria-label="기록 관리">
      <button id="refresh" type="button">기록 새로고침</button>
      <button id="export-json" class="primary" type="button">전체 JSON 내려받기</button>
      <button id="export-csv" type="button">행동 CSV 내려받기</button>
      <label class="button" for="import-file">JSON 가져오기</label><input id="import-file" type="file" accept=".json,application/json" hidden>
      <a class="button" href="./index.html?new=1">새 참가자로 시작</a>
    </div>
    <p id="notice" role="status" aria-live="polite"></p>
    <p class="helper">M1은 첫 탭과 실제 도착 경로를 따로 표시합니다. 시간·성공률은 계산하지 않습니다. 기록은 자동으로 진행자에게 전송되지 않습니다.</p>
    <div class="workspace"><aside aria-label="참가자 선택"><h2>참가자 기록</h2><div id="session-list"></div></aside><section id="details" aria-label="선택한 참가자 기록"></section></div>
    <footer>기록은 이 기기·이 브라우저의 저장소에 보관됩니다. 브라우저 데이터를 지우기 전에 파일로 내려받아 주세요. 이 화면은 비밀번호로 보호된 관리 페이지가 아닙니다.</footer>
  </main>
</body>
</html>
